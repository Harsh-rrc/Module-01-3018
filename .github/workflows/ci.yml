name: CI Pipeline - Test for Node.js API

# This workflow runs on pushes and pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      # 1. Checkout the latest code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20          # Specify Node.js version

      # 3. Install dependencies listed in package-lock.json
      - name: Install dependencies
        run: npm ci                  # Use 'ci' for clean installs

      # 4. Lint the code to check for style and syntax issues
      - name: Run Lint (code style and quality)
        run: npm run lint

      # 5. Run all tests to verify application functionality
      - name: Run Jest tests (unit and integration)
        run: npm test                